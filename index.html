    let current = 0;
    let lastChoice = null;
    let ended = false;
    let onCover = false;
    root.className = 'game';
    root.tabIndex = 0;
    root.setAttribute('aria-label', '視覺小說遊戲');
    const title = document.createElement('div'); title.className = 'game-title'; title.textContent = story.title;
    const box = document.createElement('section'); box.className = 'dialogue'; box.setAttribute('aria-live', 'polite');
    root.replaceChildren(title, box);
    function button(text, action) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = text;
      b.addEventListener('click', e => { e.stopPropagation(); action(); });
      return b;
    }
    const cover = document.createElement('section'); cover.className = 'cover'; cover.hidden = true;
    root.append(cover);
    function showCover() {
      onCover = true; title.hidden = true; box.hidden = true; cover.hidden = false;
      root.style.backgroundImage = story.cover.bg == null ? '' : 'url("' + story.images[story.cover.bg] + '")';
      cover.replaceChildren();
      if (story.cover.showTitle) { const h = document.createElement('h1'); h.className = 'cover-heading'; h.textContent = story.title; cover.append(h); }
      cover.append(button('開始遊戲', begin));
    }
    function begin() { onCover = false; cover.hidden = true; title.hidden = false; box.hidden = false; render(); root.focus({preventScroll:true}); }
    function restart() { current = 0; lastChoice = null; ended = false; if (story.cover) showCover(); else render(); }
    function render() {
      const s = story.scenes[current];
      root.style.backgroundImage = s.bg == null ? '' : 'url("' + story.images[s.bg] + '")';
      box.className = 'dialogue' + (s.end === 'bad' ? ' bad' : '');
      box.replaceChildren(); box.scrollTop = 0;
      const speaker = document.createElement('h1'); speaker.className = 'speaker'; speaker.textContent = s.speaker || '旁白';
      const words = document.createElement('p'); words.className = 'words'; words.textContent = s.text;
      box.append(speaker, words);
      const actions = document.createElement('div'); actions.className = 'actions';
      ended = Boolean(s.end) || (!s.choices && s.next == null);
      if (ended) {
        const label = document.createElement('p'); label.className = 'ending-label';
        label.textContent = s.end === 'bad' ? 'BAD END · 故事仍有另一種可能' : 'THE END · 謝謝你走到這裡';
        box.append(label);
        if (s.end === 'bad' && lastChoice !== null) actions.append(button('↶ 返回剛才的選項', () => { current = lastChoice; render(); }));
        actions.append(button('重新開始', restart)); box.append(actions);
      } else if (s.choices) {

        box.append(actions);
      } else box.append(button('輕觸繼續 ▾', advance));
      const prompt = box.querySelector('button:not(.actions button)');
      if (prompt) prompt.className = 'prompt';
    }
    function advance() {
      if (onCover) { begin(); return; }
      const s = story.scenes[current];
      if (ended || s.choices) return;
      current = s.next; render();
    }
    root.addEventListener('click', e => { if (!e.target.closest('button')) advance(); });
    root.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && !e.target.closest('button')) { e.preventDefault(); advance(); }
    });
    if (story.cover) showCover(); else render();
  })(document.getElementById("game"),story);</script></body></html>
